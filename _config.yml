title: Jekyll VitePress Theme
description: Jekyll VitePress Theme is a VitePress-style documentation theme and plugin for Jekyll with Jekyll-first extensions beyond baseline VitePress.
url: "https://jekyll-vitepress.dev"
baseurl: ""
lang: en-US
timezone: UTC
logo: /assets/images/favicon/web-app-manifest-512x512.png
author:
  name: Carmine Paolino
  url: https://paolino.me
# This repo's docs site keeps its own include overrides outside gem payload.
includes_dir: docs/_includes

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

theme: jekyll-vitepress-theme

collections:
  introduction:
    output: true
    permalink: "/:name/"
  core_features:
    output: true
    permalink: "/:name/"
  advanced:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: introduction
    values:
      layout: default
  - scope:
      type: core_features
    values:
      layout: default
  - scope:
      type: advanced
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: Article
    image:
      path: /assets/images/screenshots/home-light.png
      alt: Jekyll VitePress Theme documentation homepage
      width: 1600
      height: 1000
    publisher:
      type: Organization
      name: Jekyll VitePress Theme
      url: https://jekyll-vitepress.dev
      logo: /assets/images/favicon/web-app-manifest-512x512.png
      same_as:
        - https://github.com/crmne/jekyll-vitepress-theme
        - https://rubygems.org/gems/jekyll-vitepress-theme
  llms:
    title: Jekyll VitePress Theme
    description: Jekyll VitePress Theme is a VitePress-style documentation theme and plugin gem for Jekyll that also adds Jekyll-first extensions beyond VitePress.
    full: true
    details: >-
      Jekyll VitePress Theme provides a VitePress-like documentation experience with Jekyll-native navigation, search, Markdown extensions, project integrations, SEO, and AI-readable discovery files. The canonical documentation is [jekyll-vitepress.dev](https://jekyll-vitepress.dev), the source is on [GitHub](https://github.com/crmne/jekyll-vitepress-theme), and releases are published on [RubyGems](https://rubygems.org/gems/jekyll-vitepress-theme).
  branding:
    site_title: Jekyll VitePress
    logo:
      default: /assets/images/theme/vitepress-logo-mini.svg
      light: /assets/images/theme/vitepress-logo-mini.svg
      dark: /assets/images/theme/vitepress-logo-mini.svg
      alt: VitePress
      width: 24
      height: 24
  typography:
    body_font_family: "'Inter', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'"
    code_font_family: "ui-monospace, 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace"
    google_fonts_url: "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Brought to you by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, maker of
    copyright: >-
      <span class="footer-brand-links"><a href="https://chatwithwork.com" class="footer-chatwithwork-link" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo theme-image light" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"><img class="footer-chatwithwork-logo theme-image dark" src="https://chatwithwork.com/logotype-dark.svg" alt="Chat with Work"></a><a href="https://rubyllm.com" class="footer-rubyllm-link" target="_blank" rel="noreferrer"><img class="footer-rubyllm-logo theme-image light" src="https://rubyllm.com/assets/images/logotype.svg" alt="RubyLLM"><img class="footer-rubyllm-logo theme-image dark" src="https://rubyllm.com/assets/images/logotype_dark.svg" alt="RubyLLM"></a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: vitepress
  edit_link:
    enabled: true
    pattern: "https://github.com/crmne/jekyll-vitepress-theme/edit/master/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: crmne/jekyll-vitepress-theme
    text: Star
    show_count: true
  github_sponsor:
    enabled: true
    user: crmne
    text: Sponsor
  gem_downloads:
    enabled: true
    name: jekyll-vitepress-theme
    text: Gem downloads
    show_count: true
  labels:
    outline: On this page
    sidebar_menu: Menu
    return_to_top: Return to top
    skip_to_content: Skip to content
    appearance_menu: Appearance
    switch_to_dark: Switch to dark theme
    switch_to_light: Switch to light theme
  behavior:
    scroll_offset: 134

plugins:
  - jekyll-vitepress-theme
  - jekyll-redirect-from

exclude:
  - _site
  - .jekyll-cache
  - vendor
  - node_modules
  - scripts
  - test
  - lib
  - "*.gem"
  - jekyll-vitepress-theme.gemspec
  - Gemfile
  - Gemfile.lock
