name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/publish-docs.yml'
      - '_**/**'
      - '_config.yml'
      - 'assets/**'
      - 'exe/**'
      - 'lib/**'
      - '*.md'
      - 'search.json'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '*.txt'
      - '.github/scripts/indexnow.rb'
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: ./.github/workflows/publish-docs.yml
    with:
      docs-directory: .
