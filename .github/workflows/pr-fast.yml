name: PR Fast

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "lib/**"
      - "*.gemspec"
      - "Gemfile"
      - "Gemfile.lock"
      - ".rubocop.yml"
      - ".github/workflows/_lint.yml"
      - ".github/workflows/pr-fast.yml"

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop (Fast)
    uses: ./.github/workflows/_lint.yml
    with:
      ruby-version: "3.3"
      bundler-cache: false
