version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      bundler-security:
        applies-to: security-updates
        patterns: ["*"]
      bundler:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
